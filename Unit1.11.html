    <h1>Static IP Address</h1>

    <p>A <b>Static IP address</b> is an IP address that remains fixed for a long period and normally does not change automatically.</p>

    <h3>Uses:</h3>
    <ul>
        <li>Servers</li>
        <li>Enterprise networks</li>
        <li>VPNs</li>
        <li>Network devices that need a stable address</li>
    </ul>

    <p><b>Example:</b><br>192.168.1.100</p>

    <h3>Remember:<br>Static IP = Fixed IP</h3>
