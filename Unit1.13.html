<!DOCTYPE html>
<html>
<head>
    <title>Static IP vs Dynamic IP</title>
</head>
<body>
    <h1>Static IP vs Dynamic IP</h1>

    <table border="1">
        <tr>
        <th>Static IP</th>
        <th>Dynamic IP</th>
        </tr>

        <tr>
        <td>Fixed address</td>
        <td>Can change</td>
        </tr>

        <tr>
        <td>Manual</td>
        <td>Automatic</td>
        </tr>

        <tr>
        <td>Used for servers</td>
        <td>Used for normal devices</td>
        </tr>

        <tr>
        <td>192.168.1.100</td>
        <td>192.168.0.101</td>
        </tr>

        </table>

</body>
</html>
